name: Library and app checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:library
      - name: Check valid common-word and script character fixtures
        run: npm run lint:library -- tools/fixtures/valid
      - name: Check invalid script character fixtures fail with expected errors
        run: node --test tools/test-lint-script-chars.mjs
      - run: npm run build:library
      - name: Check committed library index
        run: |
          git ls-files --error-unmatch library/index.json
          git diff --exit-code -- library/index.json
      - run: npm run check:sw
